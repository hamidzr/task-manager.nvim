name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  neovim:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, v0.10.0, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Run regression tests
        run: |
          nvim --version
          nvim --headless --clean -u NONE -U NONE -n -l tests/run.lua
